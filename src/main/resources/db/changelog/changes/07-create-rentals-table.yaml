databaseChangeLog:
  - changeSet:
      id: create-rentals-table
      author: you
      changes:
        - createTable:
            tableName: rentals
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: rental_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: return_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: actual_return_date
                  type: DATE

              - column:
                  name: car_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_rentals_car
            baseTableName: rentals
            baseColumnNames: car_id
            referencedTableName: cars
            referencedColumnNames: id
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            constraintName: fk_rentals_user
            baseTableName: rentals
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT

        - createIndex:
            indexName: idx_rentals_user
            tableName: rentals
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_rentals_car
            tableName: rentals
            columns:
              - column:
                  name: car_id

        - createIndex:
            indexName: idx_rentals_dates
            tableName: rentals
            columns:
              - column:
                  name: rental_date
