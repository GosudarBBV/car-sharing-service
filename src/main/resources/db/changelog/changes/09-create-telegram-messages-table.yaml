databaseChangeLog:
  - changeSet:
      id: create-telegram-messages-table
      author: you
      changes:
        - createTable:
            tableName: telegram_messages
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: chat_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: message
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: sent_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_telegram_chat_id
            tableName: telegram_messages
            columns:
              - column:
                  name: chat_id
        - createIndex:
            indexName: idx_telegram_sent_at
            tableName: telegram_messages
            columns:
              - column:
                  name: sent_at