spring.security.filter.dispatcher-types=REQUEST,ERROR,ASYNC
server.error.include-message=always
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:true}
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}
telegram.admin.chat-id=${TELEGRAM_ADMIN_CHAT_ID}
telegram.bot.register-on-startup=${TELEGRAM_REGISTER_ON_STARTUP:false}

stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
server.servlet.context-path=/api
